name: Build Tasmota ESP32

on:
  workflow_dispatch:
    inputs:
      env:
        description: "PlatformIO env (e.g. tasmota32, tasmota32-sensors, ...)"
        required: true
        default: "tasmota32"
      clean:
        description: "Clean build (true/false)"
        required: true
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            tasmota/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('tasmota/platformio.ini', 'tasmota/platformio_override.ini', 'tasmota/platformio_tasmota*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Clean (optional)
        if: ${{ inputs.clean == 'true' }}
        run: |
          platformio run -d tasmota -e "${{ inputs.env }}" -t clean

      - name: Build
        run: |
          echo "Building env: ${{ inputs.env }}"
          platformio run -d tasmota -e "${{ inputs.env }}"

      - name: Collect firmware
        run: |
          mkdir -p artifacts

          # Если Tasmota сформировала build_output
          if [ -d "tasmota/build_output/firmware" ]; then
            cp -v tasmota/build_output/firmware/* artifacts/ || true
          fi

          # На всякий случай — прямой выход PlatformIO
          find tasmota/.pio/build -maxdepth 3 -type f \
            \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) \
            -print -exec cp -v {} artifacts/ \; || true

          echo "Artifacts content:"
          ls -lah artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.env }}
          path: artifacts/*
          if-no-files-found: error
